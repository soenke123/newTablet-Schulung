<!doctype html><html data-theme="light"><head><meta charset="utf-8">
<!-- Klassendiagramme der Klausur mit dem Zeichencode von SQL Studio. bild.cjs öffnet ?v=haupt. -->
<link rel="stylesheet" href="../../fonts/outfit-inter-jetbrainsmono-985fda.css">
<link rel="stylesheet" href="../../MPSkills/tools/SQLStudio/css/app.css">
<style>html,body{margin:0;background:#eef3f5}#h{position:relative}</style></head>
<body><div id="h" class="dg-host"></div>
<script src="../../MPSkills/tools/SQLStudio/js/diagram.js"></script>
<script>
const c = (name, type, o = {}) => Object.assign({ name, type }, o);
const fk = (table, col) => ({ fk: { table, col } });
const KUNDE = { name: 'Kunde', pk: ['Vorname'], fks: [], columns: [c('Vorname', 'VARCHAR', { pk: true }), c('Nachname', 'VARCHAR'),
  c('Geburtsdatum', 'DATE'), c('Telefon', 'INT'), c('Wohnort', 'VARCHAR')] };
const V = new URLSearchParams(location.search).get('v') || 'haupt';
let S, pos, size;
if (V === 'haupt') {
  S = { tables: [
    KUNDE,
    { name: 'Kauf', pk: ['Nr'], fks: [{ cols: ['Vorname'], ref: 'Kunde', refCols: ['Vorname'] }, { cols: ['ISBN'], ref: 'Buch', refCols: ['ISBN'] }],
      columns: [c('Nr', 'INT', { pk: true }), c('Vorname', 'VARCHAR', fk('Kunde', 'Vorname')), c('ISBN', 'VARCHAR', fk('Buch', 'ISBN')), c('Zeitpunkt', 'DATETIME')] },
    { name: 'Buch', pk: ['ISBN'], fks: [], columns: [c('ISBN', 'VARCHAR', { pk: true }), c('Titel', 'VARCHAR'), c('Genre', 'VARCHAR'),
      c('Preis', 'DECIMAL(5,2)'), c('Verlag', 'VARCHAR'), c('Verlagsort', 'VARCHAR'),
      c('Strasse', 'VARCHAR'), c('Hausnr', 'INT'), c('Telefon', 'VARCHAR'), c('Bestand', 'INT')] },
    { name: 'Buch_Autor', pk: ['ISBN', 'Autor_Id'], fks: [{ cols: ['ISBN'], ref: 'Buch', refCols: ['ISBN'] }, { cols: ['Autor_Id'], ref: 'Autor', refCols: ['Id'] }],
      columns: [c('ISBN', 'VARCHAR', Object.assign({ pk: true }, fk('Buch', 'ISBN'))), c('Autor_Id', 'INT', Object.assign({ pk: true }, fk('Autor', 'Id')))] },
    { name: 'Autor', pk: ['Id'], fks: [], columns: [c('Id', 'INT', { pk: true }), c('Name', 'VARCHAR'), c('Nationalitaet', 'VARCHAR')] }
  ] };
  pos = { Kunde: { x: 0, y: 0 }, Kauf: { x: 330, y: 0 }, Buch: { x: 660, y: 0 }, Autor: { x: 330, y: 330 }, Buch_Autor: { x: 660, y: 330 } };
  size = [1060, 520];
}
const h = document.getElementById('h');
h.style.width = size[0] + 'px'; h.style.height = size[1] + 'px';
document.fonts.ready.then(() => {
  const dg = SQLDiagram.create(h);
  dg.render(S, { showTypes: true, pos });
  dg.fit();
  window.done = 1;
});
</script></body></html>
