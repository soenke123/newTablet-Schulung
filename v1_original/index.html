  <nav class="rt-top-nav">
    <div id="rt-nav-player" class="rt-nav-identity" style="display:none"></div>
    <div class="rt-nav-btn-group">
      <button class="rt-shop-btn" id="rt-shop-open" title="Shop" style="display:none">🛒<span class="rt-new-badge rt-shop-badge" id="rt-shop-badge" style="display:none">!</span></button>

        <circle class="rt-month-ring__bg"   cx="18" cy="18" r="15.9" fill="none" stroke-width="3.5"/>

          stroke-dasharray="100 100" stroke-dashoffset="100"
          transform="rotate(-90 18 18)" id="rt-ring-fill"/>
