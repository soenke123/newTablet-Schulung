<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil · Tablet Schulung</title>
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png" />
  <!-- Seit 24.11.2026 gibt es nur noch EIN Profil: MPSkills/profil.html
       (Inhalt in MPSkills/lib/profilemodal.js). Diese Adresse bleibt für
       Lesezeichen und installierte Web-Apps und leitet nur weiter.
       Woher man kam, steht im ?von= — dorthin führt „Zurück“. -->
  <script>
    (function () {
      var von = new URLSearchParams(location.search).get('von');
      if (!von) {
        var r = '';
        try { r = new URL(document.referrer).pathname.toLowerCase(); } catch (e) { /* kein Referrer */ }
        von = r.indexOf('/gamehub/') !== -1 ? 'gamehub'
            : r.indexOf('/admin/')   !== -1 ? 'admin'
            : r.indexOf('/mpskills/') !== -1 ? ''
            : 'schulung';
      }
      location.replace('MPSkills/profil.html' + (von ? '?von=' + encodeURIComponent(von) : '') + location.hash);
    })();
  </script>
</head>
<body>
  <p><a href="MPSkills/profil.html">Zum Profil</a></p>
</body>
</html>
