<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- maximum-scale zusätzlich zu user-scalable: iOS ignoriert user-scalable
       seit iOS 10, ältere Android-Browser lesen dafür maximum-scale. Der
       eigentliche Riegel gegen den Seiten-Zoom steht in js/main.js
       (lockPageZoom) und css/game.css (touch-action). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Startup Story — v3</title>
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/onboarding.css">
  <link rel="stylesheet" href="css/resource-bar.css">
  <link rel="stylesheet" href="css/tour.css">
  <link rel="stylesheet" href="css/events.css">
</head>
<body>
  <!-- Screens (Intro/Character/Platform/Game) rendern hier hinein. -->
  <div id="app"></div>

  <!-- Modal + Toast bleiben top-level (werden von RT.ui verwendet). -->
  <div id="modal-backdrop">
    <div id="modal">
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-body"></div>
      <button id="modal-close" class="modal-close">Schließen</button>
    </div>
  </div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.29.2/dist/feather.min.js"></script>

  <!-- Session-Layer: muss VOR den Spiel-Skripten stehen, damit
       window.__accessToken und waitForSession() beim Boot da sind.
       Reihenfolge wie in den anderen Season-3-Spielen. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../../supabase-config.js"></script>
  <script src="../../session.js"></script>

  <script src="js/namespace.js"></script>
  <script src="js/bus.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ledger.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/loop.js"></script>
  <script src="js/techtree.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/tour.js"></script>
  <script src="js/events.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/debug.js"></script>

  <!-- Screens registrieren sich beim Laden selbst. -->
  <script src="js/screens/introScreen.js"></script>
  <script src="js/screens/characterScreen.js"></script>
  <script src="js/screens/platformScreen.js"></script>
  <script src="js/screens/gameScreen.js"></script>

  <script src="js/main.js"></script>
</body>
</html>
