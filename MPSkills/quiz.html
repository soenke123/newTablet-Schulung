<!-- Die Farben des Editors (--ks-*) stehen im tool.css des Quiz —

     von genau hier. -->
<link rel="stylesheet" href="tools/KnowledgeStack/tool.css?v=20261004d" />
<!-- Blockierend und VOR dem <body>: setzt data-theme, bevor der
     Browser zeichnet. Siehe Kopf von lib/theme.js. -->
<script src="lib/theme.js?v=20260819d"></script>
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png" />
<link rel="icon" type="image/png" sizes="256x256" href="icons/favicon-256.png" />
<script src="../viewport.js?v=20260820"></script>
<style>
  /* Im Raum misst tool.js den Rahmen auf Bildschirmhöhe, und der
     Editor rollt darin. Hier ist die Seite selbst die Bühne: der
     Rahmen wächst mit, gerollt wird die Seite. */
  .ks-frame.ks-frame--seite {
    --ks-h: 720px;
    height: auto;
    min-height: calc(var(--vv-h, 100vh) - 190px);
    overflow: visible;
  }
  .ks-frame--seite .ks-stage {
    position: relative;
    inset: auto;
    overflow: visible;
  }
  .ks-frame--seite .ks-stage > .kse-wrap { overflow: visible; }
  .quiz-wrap { max-width: 1040px; padding-top: 22px; }
</style>
</head>
