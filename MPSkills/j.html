<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mitmachen · MPSkills</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260826e" />
<!-- Blockierend und VOR dem <body>: setzt data-theme, bevor der
     Browser zeichnet. Steht sie weiter unten, blitzt die helle
     Seite auf. Siehe Kopf von lib/theme.js. -->
<script src="lib/theme.js?v=20260819d"></script>
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png" />
<link rel="icon" type="image/png" sizes="256x256" href="icons/favicon-256.png" />

<!-- Schreibt den sichtbaren Bereich (Tastatur, Adressleiste) als
     CSS-Variablen an <html>. Blockierend im <head>, damit ein Modal
     nicht erst falsch gezeichnet und dann verschoben wird. -->
<script src="../viewport.js?v=20260820"></script>
</head>
<body>

<header class="topbar">
  <a class="wordmark" href="index.html"><img class="wordmark-logo" src="../LogoMPSkills.png" alt="" /><span class="wordmark-text">MP<span>Skills</span></span></a>
  <div class="topbar-spacer"></div>
  <span class="userpill" id="whoBar" hidden><strong id="whoName"></strong></span>

  <!-- Hell/Dunkel. Diese Seite hat als einzige keine Anmelde-Ecke
       (bewusst — sie drängte zu einem Konto, das hier niemand
       braucht), also gibt es kein Menü, in dem der Schalter sitzen
       könnte. Er steht deshalb offen da; gefüllt wird der Kasten
       von lib/theme.js über das data-Attribut. -->
  <div data-theme-switch="bar"></div>
</header>

<!-- Im Raum stehen hier zwei Reiter: „Raum" (wer ist da, wie komme
     ich wieder rein) und das Werkzeug. Davor ist der Kasten leer —
     wer noch einen Code eintippt, hat nichts zu wechseln. -->
<div id="tabHost"></div>

<main class="wrap wrap--narrow" id="mainWrap">
  <!-- Alles Weitere kommt aus j.js: Code-Eingabe, Beitritt oder Raum. -->
  <div id="joinHost">
    <p class="booting">Einen Moment …</p>
  </div>
</main>

<!-- Das Werkzeug bekommt seinen eigenen Kasten, und zwar AUSSERHALB
     von .wrap--narrow: die Wolke braucht die ganze Breite, die
     Beitrittskarte darüber nicht. Leer und ausgeblendet, solange man
     nicht in einem Raum ist. -->
<div id="toolHost" class="toolhost" hidden></div>

<footer class="foot" id="pagefoot">
  <a href="index.html">MPSkills</a>
  <span class="sep">·</span>
  Max-Planck-Schule
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- session.js wird geladen, damit ein ANGEMELDETER Schüler seinen
     Beitritt an sein Konto hängt und den Raum auf einem zweiten Gerät
     wiederfindet. Für alle anderen passiert hier nichts — Teilnehmer
     brauchen kein Konto, und ohne Anmeldung läuft alles über anon. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../supabase-config.js"></script>
<script src="../session.js?v=20260817"></script>
<!-- lib/qr.js wird hier NICHT mehr geladen (19.08.2026): auf der
     Schülerseite wird kein QR-Code mehr gezeichnet, seit „Jemanden
     dazuholen" raus ist. Die Tür gehört der Tafel. -->
<script src="lib/room.js?v=20260819"></script>
<script src="lib/tool.js?v=20260827f"></script>
<script src="j.js?v=20260819g"></script>
</body>
</html>
