<!DOCTYPE html>
<html lang="de" data-view="home">
<head>
  <meta charset="UTF-8">
<script src="../../../motion.js?v=20261115a"></script>
<script>
  /* Hell/Dunkel: im Raum vom Rahmen (MPSkills setzt data-theme am <html>),
     allein vom Gerät (prefers-color-scheme in style.css). Wie Nebeltal. */
  (function () {
    var pd = null;
    try { pd = window.parent !== window ? window.parent.document.documentElement : null; } catch (e) { pd = null; }
    if (!pd) return;
    function apply() {
      var t = pd.getAttribute('data-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      else document.documentElement.removeAttribute('data-theme');
      window.dispatchEvent(new Event('nl:theme'));
    }
    apply();
    try { new MutationObserver(apply).observe(pd, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) { /* egal */ }
  })();
</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroLab</title>
  <!-- Schriften wie Nebeltal, lokal (fonts/): Space Grotesk 500–700, JetBrains Mono -->
  <link rel="stylesheet" href="../../../fonts/spacegrotesk-jetbrainsmono-unbounded-9f6dea.css">
  <link rel="stylesheet" href="../../../fonts/cinzel-fraunces-outfit-plusjakartasans-spacegrotes-295307.css">
  <link rel="stylesheet" href="../../../fonts/outfit-inter-jetbrainsmono-985fda.css">
  <link rel="stylesheet" href="../../../fonts/katex-math-3f1a2b.css">
  <link rel="stylesheet" href="style.css?v=20261120k">
  <link rel="stylesheet" href="start.css?v=20261121b">
  <link rel="stylesheet" href="netz.css?v=20261121b">

<!-- Sichtbarer Bereich (Tastatur, Adressleiste) als CSS-Variablen. -->
<script src="../../../viewport.js?v=20260820"></script>
</head>
<body>

  <!-- Drei Ansichten (html[data-view]): home = Startseite mit den drei
       Bereichen · neuron = „Wie funktioniert ein Neuron?“ · lab = das Feld
       (Netze bauen oder Netze trainieren). js/start.js schaltet um. -->
  <header>
    <button id="btn-home" class="home-btn" title="Zur Übersicht">&#8249; Übersicht</button>
    <span class="brand">NeuroLab</span>
    <span id="area-title" class="area-title"></span>
    <div class="phase-toggle lab-only build-area-only">
      <button id="btn-build" class="phase-btn active">Build</button>
      <button id="btn-run" class="phase-btn">Run</button>
    </div>
    <button id="btn-scen" class="home-btn scen-btn lab-only" hidden title="Anderes Szenario wählen">Szenario wählen</button>
    <span class="phase-hint-text lab-only" id="phase-hint-text"></span>
    <button id="btn-reset" class="reset-btn lab-only" title="Alles zurücksetzen">&#8635; Reset</button>
    <button id="btn-print" class="print-btn lab-only" title="Druckansicht umschalten">Druck</button>
  </header>

  <!-- Startseite -->
  <section id="home" class="page">
    <div id="wait" class="wait" hidden>
      <b>Gleich geht es los.</b>
      <span>Deine Lehrkraft hat noch nichts freigegeben.</span>
    </div>
    <div id="areas"></div>
  </section>

  <!-- Bereich 1: Wie funktioniert ein Neuron? -->
  <section id="neuron-page" class="page"></section>

  <!-- Bereich 2: Vom Neuron zum Netz – Revier der Wildkatzen (js/revier.js)
       und Netz durchrechnen (js/rechnen.js); Freies Bauen ist das Feld -->
  <section id="netz-page" class="page"></section>

  <!-- Bereich 3: Szenario-Wahl im Modus „Netze trainieren“ (js/start.js) -->
  <div id="scen-picker" class="scen-picker" hidden></div>

  <!-- Das Feld ist ein Fenster (#network), in dem eine Tafel (#net-stage)
       verschoben und gezoomt wird. Die Tafel baut app.js bei jedem render()
       neu; die Lupenknöpfe stehen hier, weil sie zum Fenster gehören und den
       Neuaufbau überleben müssen. -->
  <div id="print-opts" class="print-opts" hidden></div>
  <main id="network">
    <!-- #net-stage wird von app.js eingehängt -->
    <div class="net-zoom">
      <button id="btn-zoom-out" title="Herauszoomen">&minus;</button>
      <button id="btn-zoom-fit" title="Ganzes Netz zeigen">&#10530;</button>
      <button id="btn-zoom-in"  title="Heranzoomen">+</button>
    </div>
  </main>

  <div id="popup-overlay" class="hidden">
    <div id="popup">
      <button id="popup-close">&times;</button>
      <h3 id="popup-title"></h3>
      <div id="popup-content"></div>
    </div>
  </div>

  <script src="js/theme.js?v=20261120k"></script>
  <script src="js/daten.js?v=20261120k"></script>
  <script src="app.js?v=20261120k"></script>
  <script src="js/neuron.js?v=20261121b"></script>
  <script src="js/karte.js?v=20261121b"></script>
  <script src="js/revier.js?v=20261121b"></script>
  <script src="js/rechnen.js?v=20261121b"></script>
  <script src="js/start.js?v=20261121b"></script>
</body>
</html>
