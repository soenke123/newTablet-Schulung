<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neuron-Simulator</title>
  <link rel="stylesheet" href="style.css?v=20260819c">

<!-- Sichtbarer Bereich (Tastatur, Adressleiste) als CSS-Variablen. -->
<script src="../../../viewport.js?v=20260820"></script>
</head>
<body>

  <header>
    <div class="phase-toggle">
      <button id="btn-build" class="phase-btn active">Build</button>
      <button id="btn-run" class="phase-btn">Run</button>
      <button id="btn-learn" class="phase-btn">Lernen</button>
    </div>
    <span class="phase-hint-text" id="phase-hint-text"></span>
    <button id="btn-reset" class="reset-btn" title="Alles zurücksetzen">&#8635; Reset</button>
    <button id="btn-print" class="print-btn" title="Druckansicht umschalten">Druck</button>
  </header>

  <!-- Das Feld ist ein Fenster (#network), in dem eine Tafel (#net-stage)
       verschoben und gezoomt wird. Die Tafel baut app.js bei jedem render()
       neu; die Lupenknöpfe stehen hier, weil sie zum Fenster gehören und den
       Neuaufbau überleben müssen. -->
  <main id="network">
    <!-- #net-stage wird von app.js eingehängt -->
    <div class="net-zoom">
      <button id="btn-zoom-out" title="Herauszoomen">&minus;</button>
      <button id="btn-zoom-fit" title="Ganzes Netz zeigen">&#10530;</button>
      <button id="btn-zoom-in"  title="Heranzoomen">+</button>
    </div>
  </main>

  <div id="popup-overlay" class="hidden">
    <div id="popup">
      <button id="popup-close">&times;</button>
      <h3 id="popup-title"></h3>
      <div id="popup-content"></div>
    </div>
  </div>

  <script src="app.js?v=20260819c"></script>
</body>
</html>
