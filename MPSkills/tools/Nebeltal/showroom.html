<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="../../../motion.js?v=20261115a"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nebeltal Showroom</title>
<link href="../../../fonts/archivo-inter-jetbrainsmono-outfit-2c7b4d.css" rel="stylesheet">
<link href="../../../fonts/spacegrotesk-jetbrainsmono-unbounded-9f6dea.css" rel="stylesheet">
<link href="../../../fonts/fredoka-nunito-92f508.css" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   Nebeltal — Showroom „Eiswelt“ (17.11.2026)
   Drei Varianten für eigenen Look (weg vom MPSkills-Grün) + Schneesturm
   in der Antarktis. Echte Landschaft aus js/welt.js + js/grafik.js
   (setPalette), Schnee als 2D-Ebene darüber. Level 1/2 ohne Höhenleiste
   am Rand – jede Variante zeigt die Höhe anders.
   Varianten:  a = Whiteout (Expedition, Tag)
               b = Polarnacht (Polarlicht, dunkel)
               c = Eisscholle (verspielt, Comic)
   ══════════════════════════════════════════════════════════════ */

/* ── Variante A: Whiteout · Expedition ── */
body[data-v="a"] {
  --bg:#e7edf1; --panel:#f8fafb; --panel-2:#eef3f6; --line:#14213d; --line-soft:#c5d1da;
  --ink:#14213d; --ink-soft:#435069; --ink-faint:#7c889c;
  --accent:#ff5a1f; --accent-ink:#c93d0b; --accent-dim:#ffe3d6; --on-accent:#fff;
  --gold:#e6a100; --warn:#d1213b;
  --radius:4px; --bw:1.5px; --shadow:3px 3px 0 rgba(20,33,61,.18);
  --font:'Inter', system-ui, sans-serif; --head:'Archivo', 'Inter', sans-serif; --mono:'JetBrains Mono', monospace;
  --surface:#f8fafb; --surface-2:#eef3f6; --ice:#dce9f2; --sea:#2c6f9e; --fog:#e7edf1; --peng-edge:none;
  color-scheme:light;
}
/* ── Variante B: Polarnacht · Polarlicht ── */
body[data-v="b"] {
  --bg:#070d1a; --panel:rgba(12,22,40,.78); --panel-2:rgba(22,36,62,.8); --line:rgba(120,230,210,.35); --line-soft:rgba(140,170,220,.2);
  --ink:#e8f1ff; --ink-soft:#a9bad6; --ink-faint:#6f82a3;
  --accent:#5cf2c4; --accent-ink:#7ff7d3; --accent-dim:rgba(92,242,196,.14); --on-accent:#04201a;
  --violet:#a98bff; --gold:#ffd166; --warn:#ff6b8b;
  --radius:16px; --bw:1px; --shadow:0 0 0 1px rgba(92,242,196,.08), 0 18px 40px -18px rgba(0,0,0,.8);
  --font:'Space Grotesk', system-ui, sans-serif; --head:'Unbounded', 'Space Grotesk', sans-serif; --mono:'JetBrains Mono', monospace;
  --surface:#0f1b31; --surface-2:#16243e; --ice:#1b2c46; --sea:#4fb3d9; --fog:#101a2c; --peng-edge:rgba(255,255,255,.45);
  color-scheme:dark;
}
/* ── Variante C: Eisscholle · Comic ── */
body[data-v="c"] {
  --bg:#d7f0fa; --panel:#ffffff; --panel-2:#eaf8fd; --line:#0b3954; --line-soft:#9fd3e8;
  --ink:#0b3954; --ink-soft:#33607a; --ink-faint:#6d93a8;
  --accent:#ffc93c; --accent-ink:#8a5a00; --accent-dim:#fff1c7; --on-accent:#0b3954;
  --coral:#ff6b6b; --gold:#ffb703; --warn:#e63946;
  --radius:20px; --bw:3px; --shadow:0 5px 0 #0b3954;
  --font:'Nunito', system-ui, sans-serif; --head:'Fredoka', 'Nunito', sans-serif; --mono:'Fredoka', sans-serif;
  --surface:#ffffff; --surface-2:#eaf8fd; --ice:#cdeefa; --sea:#1f8fc4; --fog:#e3f5fc; --peng-edge:none;
  color-scheme:light;
}

* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:var(--font);
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
button { font:inherit; color:inherit; }

/* ── Showroom-Leiste (neutral, gehört NICHT zur Variante) ── */
#sr { position:absolute; left:0; right:0; top:0; z-index:50; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:8px 12px; background:#1d1f24; color:#e9eaee; font:500 13.5px/1.2 Inter, system-ui, sans-serif; }
#sr b.t { font-weight:700; letter-spacing:.02em; margin-right:4px; }
.seg { display:inline-flex; border:1px solid #3a3d45; border-radius:9px; overflow:hidden; }
.seg button { border:0; background:transparent; padding:6px 11px; cursor:pointer; font-size:13.5px; font-weight:600; color:#c9cbd2; }
.seg button + button { border-left:1px solid #3a3d45; }
.seg button.on { background:#e9eaee; color:#1d1f24; }
#srNote { flex-basis:100%; color:#9a9ea9; font-size:12.5px; }
#srNote b { color:#e9eaee; }
@media (max-width: 700px) { #sr { gap:6px; } .seg button { padding:5px 8px; font-size:12.5px; } #srNote { display:none; } }

#stage { position:absolute; left:0; right:0; bottom:0; top:var(--srh, 76px); overflow:hidden; }
#welt, #snow { position:absolute; inset:0; width:100%; height:100%; display:block; }
#welt { touch-action:none; }
#snow { pointer-events:none; }
#aurora, #frost, #gust { position:absolute; inset:0; pointer-events:none; }
#aurora { display:none; }
body[data-v="b"] #aurora { display:block; height:55%; mix-blend-mode:screen; opacity:.5;
  -webkit-mask-image:linear-gradient(to bottom, #000 0%, #000 35%, transparent 100%); mask-image:linear-gradient(to bottom, #000 0%, #000 35%, transparent 100%); }
#aurora i { position:absolute; left:-20%; right:-20%; height:70%; top:-10%; border-radius:50%; filter:blur(30px);
  animation:aur 14s ease-in-out infinite alternate; }
#aurora i:nth-child(1) { background:radial-gradient(60% 40% at 30% 60%, rgba(92,242,196,.9), transparent 70%); }
#aurora i:nth-child(2) { background:radial-gradient(50% 35% at 70% 50%, rgba(169,139,255,.8), transparent 70%); animation-duration:19s; animation-delay:-6s; }
#aurora i:nth-child(3) { background:radial-gradient(40% 25% at 50% 70%, rgba(80,200,255,.6), transparent 70%); animation-duration:23s; animation-delay:-11s; }
@keyframes aur { from { transform:translateX(-8%) skewX(-8deg) scaleY(.9); } to { transform:translateX(8%) skewX(10deg) scaleY(1.15); } }
body[data-v="a"] #frost { background:radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(255,255,255,.75) 100%); }
body[data-v="c"] #frost { background:radial-gradient(130% 100% at 50% 45%, transparent 62%, rgba(255,255,255,.85) 100%); }
body[data-v="b"] #frost { background:radial-gradient(120% 95% at 50% 50%, transparent 55%, rgba(3,7,16,.65) 100%); }
#gust { opacity:0; }
body[data-v="a"] #gust { background:linear-gradient(100deg, rgba(255,255,255,.0), rgba(255,255,255,.9) 45%, rgba(240,246,250,.6)); }
body[data-v="b"] #gust { background:linear-gradient(100deg, rgba(20,34,60,0), rgba(120,150,200,.35) 45%, rgba(20,34,60,.2)); }
body[data-v="c"] #gust { background:linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.75) 50%, rgba(255,255,255,.3)); }
html[data-motion="low"] #aurora i { animation:none; }

/* ── gemeinsame Bausteine, je Variante anders gekleidet ── */
.pan { background:var(--panel); border:var(--bw) solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
.btn { border:var(--bw) solid var(--line); background:var(--panel); border-radius:var(--radius); padding:10px 16px;
  font-weight:700; font-size:15px; cursor:pointer; box-shadow:var(--shadow); color:var(--ink); }
.btn.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
body[data-v="c"] .btn.primary { border-color:var(--line); }
.kick { font-family:var(--mono); font-size:11.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent-ink); }
body[data-v="b"] .pan { -webkit-backdrop-filter:blur(14px) saturate(1.3); backdrop-filter:blur(14px) saturate(1.3); }
html[data-motion="low"] body[data-v="b"] .pan { -webkit-backdrop-filter:none; backdrop-filter:none; background:#0f1b31; }

/* A: Feldbuch – Ecken-Markierungen, Monospace-Etiketten */
body[data-v="a"] .pan { position:relative; }
body[data-v="a"] .pan.mark::before, body[data-v="a"] .pan.mark::after { content:''; position:absolute; width:10px; height:10px; border:2px solid var(--accent); }
body[data-v="a"] .pan.mark::before { left:-5px; top:-5px; border-right:0; border-bottom:0; }
body[data-v="a"] .pan.mark::after { right:-5px; bottom:-5px; border-left:0; border-top:0; }
body[data-v="a"] .btn { text-transform:uppercase; letter-spacing:.06em; font-size:13.5px; font-family:var(--mono); }
body[data-v="a"] .btn.primary { box-shadow:3px 3px 0 var(--line); }
/* B: leuchtende Kanten */
body[data-v="b"] .btn { background:rgba(15,27,49,.7); border-color:var(--line); }
body[data-v="b"] .btn.primary { background:linear-gradient(120deg, var(--accent), #62d2ff 60%, var(--violet)); border-color:transparent;
  box-shadow:0 0 24px -4px rgba(92,242,196,.6); }
/* C: Eisblöcke – dicke Ränder, harter Schatten, Drücken */
body[data-v="c"] .btn { font-family:var(--head); font-weight:600; font-size:17px; }
body[data-v="c"] .btn:active { transform:translateY(4px); box-shadow:0 1px 0 var(--line); }

/* ── HUD ── */
#hud { position:absolute; inset:0; pointer-events:none; }
#hud > * { pointer-events:auto; }
.top { position:absolute; left:12px; right:12px; top:12px; display:flex; gap:8px; align-items:center; pointer-events:none; }
.top > * { pointer-events:auto; }
.chip { padding:8px 13px; font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px; }
#tName { font-family:var(--head); }
#tName small { font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--ink-faint); text-transform:uppercase; font-weight:700; }
#tTime { margin-left:auto; font-variant-numeric:tabular-nums; font-family:var(--mono); min-width:86px; justify-content:center; }
body[data-v="c"] #tTime { font-family:var(--head); font-size:18px; }

/* Höhe: kein Balken am Rand mehr */
#alt { position:absolute; display:flex; align-items:center; gap:10px; padding:7px 12px; pointer-events:none; font-variant-numeric:tabular-nums; }
#alt .v { font-weight:800; font-size:20px; font-family:var(--mono); white-space:nowrap; }
#alt .l { font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); font-weight:700; line-height:1.15; }
#alt .best { font-size:12.5px; color:var(--ink-soft); white-space:nowrap; line-height:1.2; }
#alt .best b { color:var(--ink); }
#alt .tr { font-size:14px; width:16px; text-align:center; }
#alt .tr.dn { color:#1f9d6b; } #alt .tr.up { color:var(--warn); }
/* A: Höhenmesser oben mittig wie ein Gerät */
body[data-v="a"] #alt { left:50%; top:12px; transform:translateX(-50%); background:var(--ink); color:#fff; border:var(--bw) solid var(--ink);
  border-radius:var(--radius); box-shadow:var(--shadow); }
body[data-v="a"] #alt .l, body[data-v="a"] #alt .best { color:#9fb0c8; }
body[data-v="a"] #alt .best b { color:#fff; }
body[data-v="a"] #alt .v { color:#ffb08f; }
body[data-v="a"] #alt .sep { width:1px; align-self:stretch; background:#3a4a6a; }
/* B: schwebt über dem Pinguin */
body[data-v="b"] #alt { left:0; top:0; flex-direction:column; gap:0; padding:5px 11px 6px; border-radius:12px;
  background:rgba(8,16,30,.72); border:1px solid var(--line); box-shadow:0 0 20px -6px rgba(92,242,196,.5); }
body[data-v="b"] #alt .v { font-size:17px; color:var(--accent-ink); }
body[data-v="b"] #alt .l, body[data-v="b"] #alt .sep, body[data-v="b"] #alt .tr { display:none; }
body[data-v="b"] #alt .best { font-size:11.5px; }
body[data-v="b"] #alt::after { content:''; position:absolute; left:50%; bottom:-6px; width:10px; height:10px; margin-left:-5px;
  background:rgba(8,16,30,.72); border-right:1px solid var(--line); border-bottom:1px solid var(--line); transform:rotate(45deg); }
/* C: Eisblock-Plakette unten neben dem Knopf */
body[data-v="c"] #alt { position:static; background:var(--panel); border:var(--bw) solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:6px 14px 6px 8px; }
body[data-v="c"] #alt .ico { width:40px; height:40px; flex:none; }
body[data-v="c"] #alt .v { font-family:var(--head); font-size:24px; font-weight:600; }
body[data-v="c"] #alt .l { font-family:var(--head); letter-spacing:.02em; text-transform:none; font-size:12.5px; }
body[data-v="c"] #alt .sep { display:none; }
#alt .ico { display:none; }
body[data-v="c"] #alt .ico { display:block; }
body[data-alt="off"] #alt { display:none !important; }

.bottom { position:absolute; left:12px; right:12px; bottom:14px; display:flex; align-items:flex-end; justify-content:center; gap:12px; pointer-events:none; }
.bottom > * { pointer-events:auto; }
#btnStay { font-size:16px; padding:13px 22px; }
body[data-v="c"] #btnStay { font-size:19px; padding:12px 24px; }

#joy { position:absolute; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; pointer-events:none;
  border:2px solid rgba(255,255,255,.8); background:rgba(255,255,255,.2); }
#joy i { position:absolute; left:50%; top:50%; width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,.9);
  box-shadow:0 2px 8px rgba(0,0,0,.25); transform:translate(-50%,-50%); }
body[data-v="a"] #joy { border-radius:8px; border-color:var(--ink); background:rgba(248,250,251,.35); }
body[data-v="a"] #joy i { border-radius:6px; background:var(--accent); }
body[data-v="b"] #joy { border-color:rgba(92,242,196,.5); background:rgba(92,242,196,.08); }
body[data-v="b"] #joy i { background:rgba(92,242,196,.75); box-shadow:0 0 18px rgba(92,242,196,.6); }
body[data-v="c"] #joy { border:3px solid var(--line); background:rgba(255,255,255,.4); }
body[data-v="c"] #joy i { background:var(--accent); border:3px solid var(--line); }
#hint { position:absolute; left:50%; bottom:86px; transform:translateX(-50%); font-size:13px; color:var(--ink-soft); white-space:nowrap;
  padding:5px 11px; pointer-events:none; transition:opacity .6s; }

/* ── Menü + Karte ── */
.over { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; overflow:auto; }
#card.over { background:rgba(10,20,35,.18); }
.menu-in { width:min(580px, 100%); padding:24px 24px 20px; max-height:100%; overflow:auto; }
.menu-in h1 { margin:6px 0 2px; font-family:var(--head); font-size:38px; letter-spacing:-.01em; line-height:1.05; }
.menu-in .sub { margin:6px 0 16px; color:var(--ink-soft); font-size:16px; line-height:1.45; }
#levels { display:grid; gap:8px; margin:0 0 14px; }
.lv { display:flex; align-items:center; gap:14px; text-align:left; width:100%; padding:11px 14px; cursor:pointer;
  border:var(--bw) solid var(--line-soft); background:var(--panel-2); border-radius:var(--radius); }
.lv-n { flex:none; width:36px; height:36px; display:grid; place-items:center; font-weight:800; font-size:16px;
  border-radius:50%; background:var(--accent-dim); color:var(--accent-ink); font-family:var(--mono); }
.lv-t { flex:1; display:flex; flex-direction:column; }
.lv-t b { font-size:16px; font-family:var(--head); font-weight:700; } .lv-t small { color:var(--ink-faint); font-size:13.5px; }
.stars { letter-spacing:1px; font-size:17px; color:var(--line-soft); white-space:nowrap; }
.stars .on { color:var(--gold); }
.seedrow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; color:var(--ink-soft); font-size:14px; }
.seedrow input { width:86px; font:inherit; font-size:16px; font-weight:700; padding:7px 9px; border-radius:var(--radius);
  border:var(--bw) solid var(--line-soft); background:var(--panel-2); color:var(--ink); text-align:center; font-family:var(--mono); }
.seedrow .btn { padding:7px 12px; font-size:13px; box-shadow:none; }
/* A */
body[data-v="a"] .menu-in h1 { text-transform:uppercase; font-weight:900; font-size:44px; letter-spacing:.01em; }
body[data-v="a"] .lv-n { border-radius:3px; background:var(--ink); color:#fff; }
body[data-v="a"] .lv { border-color:var(--line-soft); background:#fff; }
body[data-v="a"] .lv:hover { border-color:var(--accent); }
body[data-v="a"] .lv-t small { font-family:var(--mono); font-size:12px; }
body[data-v="a"] .coords { font-family:var(--mono); font-size:11.5px; color:var(--ink-faint); letter-spacing:.06em; margin-top:2px; }
/* B */
body[data-v="b"] .menu-in h1 { font-weight:600; font-size:36px; background:linear-gradient(100deg, #e8f1ff, var(--accent) 55%, var(--violet));
  -webkit-background-clip:text; background-clip:text; color:transparent; }
body[data-v="b"] .lv { background:rgba(255,255,255,.03); border-color:var(--line-soft); }
body[data-v="b"] .lv:hover { border-color:var(--accent); box-shadow:0 0 18px -6px rgba(92,242,196,.6); }
body[data-v="b"] .lv-n { background:transparent; border:1px solid var(--accent); color:var(--accent); box-shadow:inset 0 0 10px rgba(92,242,196,.25); }
body[data-v="b"] .lv:nth-child(n+4) .lv-n { border-color:var(--violet); color:var(--violet); box-shadow:inset 0 0 10px rgba(169,139,255,.25); }
/* C */
body[data-v="c"] .menu-in h1 { font-weight:600; font-size:46px; color:var(--line); text-shadow:3px 3px 0 var(--accent); }
body[data-v="c"] .lv { border-color:var(--line); background:#fff; box-shadow:0 3px 0 var(--line); }
body[data-v="c"] .lv:active { transform:translateY(3px); box-shadow:none; }
body[data-v="c"] .lv-n { width:40px; height:40px; border-radius:12px; border:3px solid var(--line); background:var(--ice); color:var(--line); font-family:var(--head); font-size:19px; }
body[data-v="c"] .lv-t b { font-weight:600; font-size:18px; }
body[data-v="c"] .menu-in { position:relative; }
.drips { display:none; }
body[data-v="c"] .drips { display:block; position:absolute; left:18px; right:18px; top:-3px; height:16px; pointer-events:none; }

.card-in { width:min(620px, 100%); padding:22px 22px 18px; max-height:100%; overflow:auto; }
.card-in h2 { margin:4px 0 10px; font-family:var(--head); font-size:27px; }
body[data-v="a"] .card-in h2 { text-transform:uppercase; font-weight:900; }
body[data-v="c"] .card-in h2 { font-weight:600; font-size:30px; }
.card-in p { margin:0 0 12px; line-height:1.5; font-size:16px; color:var(--ink-soft); }
.card-in p b, .card-in li b { color:var(--ink); }
.card-in p.lead { font-size:17px; color:var(--ink); }
.illwrap { margin:0 0 12px; border-radius:var(--radius); overflow:hidden; border:var(--bw) solid var(--line-soft); background:var(--surface-2); }
.illwrap svg { display:block; width:100%; height:auto; }
ol.steps { list-style:none; counter-reset:st; margin:0 0 12px; padding:0; display:grid; gap:8px; }
ol.steps li { counter-increment:st; position:relative; padding:2px 0 2px 38px; line-height:1.45; font-size:15.5px; color:var(--ink-soft); }
ol.steps li::before { content:counter(st); position:absolute; left:0; top:0; width:27px; height:27px; border-radius:50%;
  display:grid; place-items:center; background:var(--accent-dim); color:var(--accent-ink); font-weight:800; font-size:14px; font-family:var(--mono); }
body[data-v="a"] ol.steps li::before { border-radius:3px; background:var(--ink); color:#fff; content:'0' counter(st); font-size:11.5px; }
body[data-v="b"] ol.steps li::before { background:transparent; border:1px solid var(--accent); color:var(--accent); }
body[data-v="c"] ol.steps li::before { border:2.5px solid var(--line); background:var(--accent); color:var(--line); font-family:var(--head); border-radius:9px; }
.ctrl { font-size:14px !important; padding-top:10px; border-top:var(--bw) solid var(--line-soft); }
.card-btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
</style>
</head>
<body data-v="a" data-alt="on">

<div id="sr">
  <b class="t">Nebeltal · Showroom Eiswelt</b>
  <div class="seg" id="segV">
    <button data-v="a" class="on">A · Whiteout</button><button data-v="b">B · Polarnacht</button><button data-v="c">C · Eisscholle</button>
  </div>
  <div class="seg" id="segL"><button data-l="1" class="on">Level 1</button><button data-l="2">Level 2</button></div>
  <div class="seg" id="segS"><button data-s="play" class="on">Im Spiel</button><button data-s="menu">Menü</button><button data-s="card">Erklärkarte</button></div>
  <div class="seg" id="segA"><button data-a="on" class="on">Höhe anzeigen</button><button data-a="off">ohne Höhe</button></div>
  <div id="srNote"></div>
</div>

<div id="stage">
  <canvas id="welt" aria-label="Eis-Landschaft im Schneesturm"></canvas>
  <div id="aurora"><i></i><i></i><i></i></div>
  <canvas id="snow"></canvas>
  <div id="gust"></div>
  <div id="frost"></div>

  <div id="hud">
    <div class="top">
      <button class="chip btn" type="button" data-go="menu">‹ Übersicht</button>
      <div class="chip pan" id="tName"></div>
      <div class="chip pan" id="tTime">1:15</div>
    </div>
    <div id="alt" aria-live="polite">
      <svg class="ico" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 33 L15 12 L21 21 L26 15 L36 33 Z" fill="#cdeefa" stroke="#0b3954" stroke-width="3" stroke-linejoin="round"/><path d="M15 12 L11 20 L15 18 L18 21 Z" fill="#fff"/><circle cx="31" cy="8" r="4" fill="#ffc93c" stroke="#0b3954" stroke-width="2.5"/></svg>
      <div class="l">Höhe</div>
      <div class="v" id="altV">–</div>
      <div class="tr" id="altT"></div>
      <div class="sep"></div>
      <div class="best">tiefste bisher<br><b id="altB">–</b></div>
    </div>
    <div class="bottom" id="bottom">
      <button id="btnStay" class="btn primary" type="button">Hier bleibe ich!</button>
    </div>
    <div id="hint" class="pan">Wischen oder WASD = laufen · Q/E = drehen</div>
    <div id="joy" hidden><i></i></div>
  </div>

  <div id="menu" class="over" hidden>
    <div class="menu-in pan mark">
      <svg class="drips" viewBox="0 0 500 16" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0 H500 V3 C490 3 488 14 482 14 C476 14 476 3 466 3 H380 C372 3 371 10 366 10 C361 10 360 3 352 3 H220 C212 3 211 15 205 15 C199 15 198 3 190 3 H70 C62 3 61 9 57 9 C53 9 52 3 44 3 H0 Z" fill="#cdeefa" stroke="#0b3954" stroke-width="2.5"/></svg>
      <div class="kick" id="mKick"></div>
      <h1>Nebeltal</h1>
      <div class="coords" id="mCoords" hidden>77°51′ S · 166°40′ O · Station Nebeltal</div>
      <p class="sub">Wie lernt eine KI? Sie sucht im Schneesturm den tiefsten Punkt einer Landschaft – und sieht dabei nur die Stelle, an der sie gerade steht.</p>
      <div id="levels"></div>
      <div class="seedrow"><label for="seed">Welt-Nummer</label><input id="seed" value="4711" inputmode="numeric"><button class="btn" type="button" id="dice">Neue Welt</button></div>
    </div>
  </div>

  <div id="card" class="over" hidden><div class="card-in pan mark" id="cardIn"></div></div>
</div>

<script src="js/welt.js?v=20261117k"></script>
<script src="js/bilder.js?v=20261117i"></script>
<script src="js/grafik.js?v=20261117i"></script>
<script>
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const low = () => !!(window.LWMotion && LWMotion.low);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const fmt = (v, d) => v.toFixed(d).replace('.', ',');

  /* ── Die drei Varianten ── */
  const V = {
    a: {
      name: 'Whiteout', kick: 'Forschungsstation · Feldbuch',
      note: '<b>A · Whiteout</b> – heller Tag im Sturm, alles weiß-blau. Oberfläche wie Expeditions-Ausrüstung: Signal-Orange, Monospace-Etiketten, harte Kanten. Höhe als Gerät oben in der Mitte.',
      pal: { fog: '#e7edf1', c: ['#6f9cc0', '#b2cde0', '#e1eaf1', '#ffffff'], plainC: '#e9f0f5', amb: 0.55,
        ice: 1, iceC: '#8dbbdc', light: [-0.5, 0.75, 0.35] },
      scarf: [1, 0.35, 0.12], arrow: [1, 0.36, 0.12], fog: 8,
      snow: { n: 520, wind: 2.4, fall: 0.9, size: 1.6, streak: 0.9, col: '255,255,255', edge: 'rgba(90,110,140,.35)', gust: 0.55 },
      alt: 'top'
    },
    b: {
      name: 'Polarnacht', kick: 'Expedition 2026 · Polarlicht',
      note: '<b>B · Polarnacht</b> – dunkle Antarktis-Nacht mit Polarlicht, das Eis leuchtet von innen. Oberfläche aus Glas mit leuchtenden Kanten (Türkis/Violett). Höhe schwebt über dem Pinguin.',
      pal: { fog: '#0c1526', c: ['#123a57', '#2d6688', '#86a9c2', '#dfeaf3'], plainC: '#4a6e8a', amb: 0.4,
        ice: 1, iceC: '#2fa3bf', light: [-0.35, 0.7, 0.55], dark: true },
      scarf: [0.36, 0.95, 0.77], arrow: [0.36, 0.95, 0.77], fog: 9,
      snow: { n: 360, wind: 3.2, fall: 0.7, size: 1.3, streak: 1.3, col: '205,225,255', edge: null, gust: 0.45 },
      alt: 'follow'
    },
    c: {
      name: 'Eisscholle', kick: 'Ein Abenteuer im ewigen Eis',
      note: '<b>C · Eisscholle</b> – türkises Gletschereis, dicke weiche Flocken. Oberfläche wie Eisblöcke: dicke Ränder, Knöpfe zum Drücken, runde Schrift. Höhe als Plakette unten neben dem Knopf.',
      pal: { fog: '#e3f5fc', c: ['#1f8fc4', '#72cbea', '#c8edf9', '#ffffff'], plainC: '#d6f1fb', amb: 0.58,
        ice: 0.9, iceC: '#4fb9e6', light: [-0.4, 0.8, 0.45] },
      scarf: [1, 0.42, 0.42], arrow: [1, 0.72, 0.1], fog: 9,
      snow: { n: 190, wind: 1.3, fall: 1.1, size: 3.4, streak: 0, col: '255,255,255', edge: 'rgba(11,57,84,.28)', gust: 0.4 },
      alt: 'bottom'
    }
  };
  const LV = [
    ['Im Nebel', 'Frei suchen – nur mit dem Höhenmesser', 3],
    ['Der Bergab-Pfeil', 'Ein Pfeil zeigt, wo es bergab geht', 2],
    ['Sprünge', 'Lernrate = wie weit du springst', 1],
    ['Wie schwer ist der Pinguin?', 'Ein Neuron schätzt das Gewicht aus der Flosse', 0],
    ['Pinguine sortieren', 'Ein Neuron lernt zwei Arten zu trennen', 0],
    ['Das Nest', 'Ein Neuron reicht nicht', 0],
    ['Zwei Neuronen, zwei Welten', 'Das Nest mit zwei Neuronen – jede Welt ein Neuron', 0]
  ];

  const S = { v: 'a', lvl: 1, view: 'play', seed: 4711, p: null, camYaw: 0, best: Infinity, lastH: null, trend: 0, t0: performance.now() };
  const canvas = $('#welt');
  const G = window.NTGrafik && NTGrafik.create(canvas);
  if (!G) { document.body.insertAdjacentHTML('beforeend', '<p style="position:absolute;top:120px;width:100%;text-align:center">Kein WebGL auf diesem Gerät.</p>'); return; }

  function buildWorld() {
    S.world = NTWelt.hills(S.seed, S.lvl);
    G.setWorld(S.world);
    G.setPalette(V[S.v].pal);
    const st = S.world.start;
    S.p = { x: st.x, z: st.z, vx: 0, vz: 0, yaw: 0, phase: 0 };
    S.camYaw = Math.atan2(S.world.min.x - st.x, S.world.min.z - st.z) + 0.9;   // nicht genau auf das Ziel schauen
    S.best = Infinity; S.lastH = null;
  }

  function setVariant(v) {
    S.v = v; document.body.dataset.v = v;
    G.setPalette(V[v].pal);
    $('#srNote').innerHTML = V[v].note;
    $('#mKick').textContent = V[v].kick;
    $('#mCoords').hidden = v !== 'a';
    // Höhenanzeige umhängen: C unten neben den Knopf
    const alt = $('#alt');
    if (V[v].alt === 'bottom') $('#bottom').insertBefore(alt, $('#btnStay'));
    else $('#hud').insertBefore(alt, $('#bottom'));
    alt.style.transform = '';
    snowInit();
    renderMenu(); renderCard();
  }

  function renderMenu() {
    $('#levels').innerHTML = LV.map((l, i) => {
      const st = l[2] ? '<span class="stars">' + [0, 1, 2].map(k => '<span class="' + (k < l[2] ? 'on' : '') + '">★</span>').join('') + '</span>' : '<span class="stars"></span>';
      return '<button class="lv" type="button" data-l="' + (i + 1) + '"><span class="lv-n">' + (i + 1) + '</span><span class="lv-t"><b>' + l[0] + '</b><small>' + l[1] + '</small></span>' + st + '</button>';
    }).join('');
  }
  function renderCard() {
    const one = S.lvl === 1;
    const altWhere = { top: 'oben in der Mitte', follow: 'über deinem Pinguin', bottom: 'unten neben dem Knopf' }[V[S.v].alt];
    $('#cardIn').innerHTML = '<div class="kick">Level ' + S.lvl + '</div><h2>' + LV[S.lvl - 1][0] + '</h2>' +
      (one ? '<p class="lead">Irgendwo in dieser Eiswüste liegt der <b>tiefste Punkt</b>. Finde ihn!</p>'
           : '<p class="lead">Jetzt hast du Werkzeuge – genau die, die auch eine KI beim Lernen hat.</p>') +
      '<div class="illwrap">' + (window.NTBild ? NTBild.scene(S.lvl) : '') + '</div>' +
      '<ol class="steps">' + (one
        ? '<li>Im Schneesturm siehst du nur den Boden direkt um dich herum – <b>keine Farben, keine Höhenlinien</b>.</li>' +
          '<li>Nur die <b>Höhe ' + altWhere + '</b> verrät, wie hoch du gerade stehst.</li>' +
          '<li>Es gibt viele Mulden, aber nur eine ist die tiefste. Du hast <b>75 Sekunden</b>.</li>'
        : '<li>Ein <b>Pfeil</b> unter deinen Füßen zeigt, wo es am steilsten bergab geht.</li>' +
          '<li><b>Farben und Höhenlinien</b> verraten die Höhe: dunkles Blau = tief, Schnee = hoch.</li>' +
          '<li>Achtung: Der Pfeil kennt nur den Weg zur <b>nächsten</b> Mulde. Du hast <b>60 Sekunden</b>.</li>') +
      '</ol><p class="ctrl">Wischen = laufen · am PC WASD, Q/E dreht die Sicht</p>' +
      '<div class="card-btns"><button class="btn primary" type="button" data-go="play">Los geht’s</button><button class="btn" type="button" data-go="menu">Zurück</button></div>';
  }

  function setView(s) {
    S.view = s;
    $('#menu').hidden = s !== 'menu';
    $('#card').hidden = s !== 'card';
    $('#hud').hidden = s !== 'play';
    for (const b of document.querySelectorAll('#segS button')) b.classList.toggle('on', b.dataset.s === s);
  }
  function setLevel(l) {
    S.lvl = l;
    for (const b of document.querySelectorAll('#segL button')) b.classList.toggle('on', +b.dataset.l === l);
    $('#tName').innerHTML = '<small>Level ' + l + '</small>' + LV[l - 1][0];
    buildWorld(); renderCard();
  }

  /* ── Steuerung: Wischen (Joystick) + Tastatur ── */
  const keys = new Set(), joy = { id: null, x0: 0, y0: 0, dx: 0, dy: 0 };
  addEventListener('keydown', e => { if (e.target.tagName !== 'INPUT') keys.add(e.key.toLowerCase()); });
  addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
  canvas.addEventListener('pointerdown', e => {
    if (S.view !== 'play' || joy.id !== null) return;
    const r = $('#stage').getBoundingClientRect();
    joy.id = e.pointerId; joy.x0 = e.clientX; joy.y0 = e.clientY; joy.dx = joy.dy = 0;
    const j = $('#joy'); j.hidden = false; j.style.left = (e.clientX - r.left) + 'px'; j.style.top = (e.clientY - r.top) + 'px';
    canvas.setPointerCapture(e.pointerId);
    $('#hint').style.opacity = 0;
  });
  canvas.addEventListener('pointermove', e => {
    if (e.pointerId !== joy.id) return;
    let dx = e.clientX - joy.x0, dy = e.clientY - joy.y0; const l = Math.hypot(dx, dy);
    if (l > 50) { dx *= 50 / l; dy *= 50 / l; }
    joy.dx = dx / 50; joy.dy = dy / 50;
    $('#joy i').style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
  });
  const joyEnd = e => { if (e.pointerId !== joy.id) return; joy.id = null; joy.dx = joy.dy = 0; $('#joy').hidden = true; $('#joy i').style.transform = ''; };
  canvas.addEventListener('pointerup', joyEnd); canvas.addEventListener('pointercancel', joyEnd);

  function step(dt) {
    const p = S.p, w = S.world;
    let ix = joy.dx, iy = joy.dy;
    if (keys.has('a') || keys.has('arrowleft')) ix -= 1;
    if (keys.has('d') || keys.has('arrowright')) ix += 1;
    if (keys.has('w') || keys.has('arrowup')) iy -= 1;
    if (keys.has('s') || keys.has('arrowdown')) iy += 1;
    const rot = (keys.has('q') ? 1 : 0) - (keys.has('e') ? 1 : 0);
    S.camYaw += rot * 1.8 * dt;
    const il = Math.hypot(ix, iy); if (il > 1) { ix /= il; iy /= il; }
    const fx = Math.sin(S.camYaw), fz = Math.cos(S.camYaw);
    // Bildschirm-Richtung → Welt (vorn = Blickrichtung, rechts = −(fz, −fx))
    const tx = (-iy) * fx + (-ix) * fz, tz = (-iy) * fz - (-ix) * fx;
    const sp = 8.5;
    p.vx = lerp(p.vx, tx * sp, 1 - Math.exp(-8 * dt)); p.vz = lerp(p.vz, tz * sp, 1 - Math.exp(-8 * dt));
    const W = w.W - 3;
    p.x = clamp(p.x + p.vx * dt, -W, W); p.z = clamp(p.z + p.vz * dt, -W, W);
    const v = Math.hypot(p.vx, p.vz);
    if (v > 0.3) { const ty = Math.atan2(p.vx, p.vz); let d = ty - p.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); p.yaw += d * (1 - Math.exp(-10 * dt)); }
    p.phase += v * dt * 0.9;
    // Kamera folgt langsam der Laufrichtung, wenn man nach vorn läuft
    if (v > 1 && iy < -0.3) { let d = p.yaw - S.camYaw; d = Math.atan2(Math.sin(d), Math.cos(d)); S.camYaw += d * (1 - Math.exp(-0.8 * dt)); }
    const h = w.show(w.h(p.x, p.z));
    if (h < S.best) S.best = h;
    if (S.lastH !== null) S.trend = lerp(S.trend, (h - S.lastH) / dt, 1 - Math.exp(-4 * dt));
    S.lastH = h;
  }

  /* ── Schneesturm ── */
  const sc2 = $('#snow'), cx = sc2.getContext('2d');
  let flakes = [], gust = 0;
  function snowInit() {
    const s = V[S.v].snow, n = Math.round(s.n * (low() ? 0.35 : 1));
    flakes = [];
    for (let i = 0; i < n; i++) flakes.push({ x: Math.random(), y: Math.random(), z: 0.25 + Math.random() * 0.75, ph: Math.random() * 6.28 });
  }
  function gustAt(t) {   // langsame Böen, 0…1
    const g = 0.5 + 0.28 * Math.sin(t * 0.31) + 0.18 * Math.sin(t * 0.83 + 1.7) + 0.1 * Math.sin(t * 2.1 + 0.4);
    return clamp((g - 0.45) / 0.55, 0, 1);
  }
  function drawSnow(dt, t, camDX) {
    const dpr = low() ? 1 : Math.min(devicePixelRatio || 1, 2);
    const W = sc2.clientWidth, H = sc2.clientHeight;
    if (sc2.width !== Math.round(W * dpr) || sc2.height !== Math.round(H * dpr)) { sc2.width = Math.round(W * dpr); sc2.height = Math.round(H * dpr); }
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.clearRect(0, 0, W, H);
    const s = V[S.v].snow;
    gust = gustAt(t);
    const wind = s.wind * (0.55 + gust * 1.1), fall = s.fall;
    cx.lineCap = 'round';
    for (const f of flakes) {
      const z = f.z;
      const vx = (wind * z + Math.sin(t * 1.3 + f.ph) * 0.15) * 0.18 - camDX * z * 0.03;
      const vy = (fall * z + 0.1) * 0.16;
      f.x += vx * dt; f.y += vy * dt;
      if (f.x > 1.05) f.x -= 1.1; if (f.x < -0.05) f.x += 1.1;
      if (f.y > 1.05) { f.y -= 1.1; f.x = Math.random(); }
      const X = f.x * W, Y = f.y * H, r = s.size * z * (S.v === 'c' ? 1.2 : 1);
      const a = 0.35 + 0.6 * z;
      if (s.streak > 0) {
        const len = s.streak * (wind * z) * 7 + 1;
        const ang = Math.atan2(vy, vx);
        cx.strokeStyle = 'rgba(' + s.col + ',' + a.toFixed(2) + ')';
        cx.lineWidth = r;
        cx.beginPath(); cx.moveTo(X, Y); cx.lineTo(X - Math.cos(ang) * len, Y - Math.sin(ang) * len); cx.stroke();
      } else {
        cx.beginPath(); cx.arc(X, Y, r, 0, 6.283);
        cx.fillStyle = 'rgba(' + s.col + ',' + a.toFixed(2) + ')'; cx.fill();
        if (s.edge && z > 0.7) { cx.strokeStyle = s.edge; cx.lineWidth = 1; cx.stroke(); }
      }
      if (s.edge && s.streak > 0 && z > 0.85) {   // ein paar dunkle Ränder, damit Weiß auf Weiß sichtbar bleibt
        cx.strokeStyle = s.edge; cx.lineWidth = 0.6;
        cx.beginPath(); cx.arc(X, Y, r * 0.9, 0, 6.283); cx.stroke();
      }
    }
    $('#gust').style.opacity = (gust * s.gust).toFixed(3);
  }

  /* ── Bild für Bild ── */
  let last = performance.now(), lastCam = 0;
  function tick(now) {
    requestAnimationFrame(tick);
    const dt = Math.min(0.05, (now - last) / 1000);
    if (low() && now - last < 30) return;
    last = now;
    const t = now / 1000;
    if (S.view === 'play') step(dt);
    else S.camYaw += dt * 0.08;          // hinter Menü/Karte dreht sich die Welt langsam
    const p = S.p, w = S.world, vr = V[S.v];
    const ground = w.h(p.x, p.z);
    const bob = Math.abs(Math.sin(p.phase * 2.2)) * 0.12 * clamp(Math.hypot(p.vx, p.vz) / 8.5, 0, 1);
    const y = ground + bob;
    const fx = Math.sin(S.camYaw), fz = Math.cos(S.camYaw);
    const at = [p.x + fx * 1.5, y + 1.0, p.z + fz * 1.5];
    const eye = [p.x - fx * 11, y + 6.4, p.z - fz * 11];
    const gy = w.h(eye[0], eye[2]) + 1.5; if (eye[1] < gy) eye[1] = gy;
    const cam = { eye, at };
    // Böe = Sicht schrumpft
    const fogR = vr.fog * (1 - 0.3 * gust);
    const objs = [];
    if (S.lvl === 2 && S.view === 'play') {
      const g = w.grad(p.x, p.z), gl = Math.hypot(g[0], g[1]);
      if (gl > 0.01) {
        const ux = -g[0] / gl, uz = -g[1] / gl, len = clamp(1.2 + gl * 3.2, 1.4, 7), pts = [], head = [];
        for (let i = 0; i <= 8; i++) { const s = 0.9 + (len - 0.9) * i / 8 * 0.78; pts.push([p.x + ux * s, p.z + uz * s, 0.2]); }
        const hs = 0.9 + (len - 0.9) * 0.78;
        for (let i = 0; i <= 6; i++) { const s = hs + (len - hs) * i / 6; head.push([p.x + ux * s, p.z + uz * s, 0.62 * (1 - i / 6) + 0.02]); }
        objs.push({ type: 'strip', pts, color: vr.arrow, glow: 0.6, lift: 0.14 }, { type: 'strip', pts: head, color: vr.arrow, glow: 0.6, lift: 0.15 });
      }
    }
    const sc = { cam, fogR, dpr: low() ? 1 : Math.min(devicePixelRatio || 1, 1.6), objects: objs, playerColor: vr.scarf,
      plain: S.lvl === 1 ? 1 : 0,
      player: { x: p.x, y, z: p.z, ground, yaw: p.yaw, tilt: 0, squash: 1, phase: p.phase, walk: clamp(Math.hypot(p.vx, p.vz) / 8.5, 0, 1) } };
    G.frame(sc);
    const camDX = (S.camYaw - lastCam) / Math.max(dt, 1e-3) * 30 + (p.vx * fz - p.vz * fx) * 0.6; lastCam = S.camYaw;
    drawSnow(dt, t, camDX);
    hudUpdate(sc, y);
  }

  function hudUpdate(sc, y) {
    if (S.view !== 'play') return;
    const h = S.lastH;
    $('#altV').textContent = h == null ? '–' : fmt(h, 1) + ' m';
    $('#altB').textContent = isFinite(S.best) ? fmt(S.best, 1) + ' m' : '–';
    const tr = $('#altT');
    tr.className = 'tr ' + (S.trend < -0.3 ? 'dn' : S.trend > 0.3 ? 'up' : '');
    tr.textContent = S.trend < -0.3 ? '▼' : S.trend > 0.3 ? '▲' : '·';
    const left = Math.max(0, (S.lvl === 1 ? 75 : 60) - (performance.now() - S.t0) / 1000);
    $('#tTime').textContent = Math.floor(left / 60) + ':' + String(Math.floor(left % 60)).padStart(2, '0');
    if (left <= 0) S.t0 = performance.now();
    if (V[S.v].alt === 'follow') {
      const q = G.project(sc, [S.p.x, y + 3.4, S.p.z]), a = $('#alt');
      if (q) a.style.transform = 'translate(' + Math.round(q.x - a.offsetWidth / 2) + 'px,' + Math.round(q.y - a.offsetHeight - 6) + 'px)';
    }
  }

  /* ── Knöpfe ── */
  function seg(id, attr, fn) {
    $(id).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      for (const x of $(id).querySelectorAll('button')) x.classList.toggle('on', x === b);
      fn(b.dataset[attr]);
    });
  }
  seg('#segV', 'v', setVariant);
  seg('#segL', 'l', l => setLevel(+l));
  seg('#segS', 's', setView);
  seg('#segA', 'a', a => { document.body.dataset.alt = a; });
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]'); if (g) { setView(g.dataset.go); if (g.dataset.go === 'play') S.t0 = performance.now(); return; }
    const l = e.target.closest('.lv'); if (l) { const n = +l.dataset.l; if (n <= 2) { setLevel(n); setView('card'); } }
  });
  $('#btnStay').addEventListener('click', () => { buildWorld(); S.t0 = performance.now(); });
  $('#dice').addEventListener('click', () => { S.seed = 1000 + Math.floor(Math.random() * 9000); $('#seed').value = S.seed; buildWorld(); });
  $('#seed').addEventListener('change', e => { const n = parseInt(e.target.value, 10); if (n >= 1000 && n <= 9999) { S.seed = n; buildWorld(); } });

  const fitBar = () => document.documentElement.style.setProperty('--srh', $('#sr').offsetHeight + 'px');
  addEventListener('resize', fitBar);
  addEventListener('lernwelt:motion', snowInit);

  setLevel(1); setVariant('a'); setView('play'); fitBar();
  requestAnimationFrame(tick);
