<!DOCTYPE html>
<html lang="de" data-night>
<head>
<meta charset="UTF-8">
<script src="../../../motion.js?v=20261115a"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nebeltal · Erarbeitung</title>
<link href="../../../fonts/spacegrotesk-jetbrainsmono-unbounded-9f6dea.css" rel="stylesheet">
<style>
/* Erarbeitung (Sönke 18.11.2026, 2. Fassung): EIN Neuron, EIN Gedanke je Schritt.
   Raten → Vergleichen → Anpassen → (viele Pinguine) = bergab ins Tal.
   Bühne in der Mitte groß, darunter ein Satz + ein Knopf. Immer Polarnacht. */
:root {
  color-scheme:dark;
  --paper:#070d1a; --surface:#0f1b31; --surface-2:#16243e; --line:#26406a; --line-soft:rgba(140,170,220,.2);
  --ink:#e8f1ff; --ink-soft:#a9bad6; --ink-faint:#6f82a3;
  --accent:#5cf2c4; --accent-ink:#7ff7d3; --accent-dim:rgba(92,242,196,.14); --on-accent:#04201a; --violet:#a98bff;
  --grad:linear-gradient(120deg, #5cf2c4, #62d2ff 60%, #a98bff); --on-grad:#04201a;
  --orange:#ff9d4d; --gold:#ffd166; --warn:#ff6b8b; --blue:#6aa8ff;
  --glass:rgba(12,22,40,.78);
  --shadow:0 0 0 1px rgba(92,242,196,.08), 0 18px 40px -18px rgba(0,0,0,.8);
  --glow:0 0 22px -6px rgba(92,242,196,.6);
  --font:'Space Grotesk', system-ui, sans-serif; --head:'Unbounded', 'Space Grotesk', sans-serif; --mono:'JetBrains Mono', monospace;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; height:100%; background:var(--paper); color:var(--ink); font-family:var(--font);
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
body { display:flex; flex-direction:column; overflow:hidden;
  background:radial-gradient(90% 60% at 20% -10%, rgba(92,242,196,.10), transparent 60%),
             radial-gradient(70% 50% at 90% 0%, rgba(169,139,255,.10), transparent 60%), var(--paper); }
button { font:inherit; color:inherit; }
.btn { border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:10px 16px; font-weight:600; font-size:15px; cursor:pointer;
  box-shadow:var(--shadow); text-decoration:none; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.btn:hover { border-color:var(--accent); box-shadow:var(--shadow), var(--glow); }
.btn.primary { background:var(--grad); color:var(--on-grad); border-color:transparent; box-shadow:var(--glow); }
.btn[disabled] { opacity:.4; cursor:default; }
.btn.sm { padding:7px 12px; font-size:14px; border-radius:12px; }
.glass { background:var(--glass); border:1px solid var(--line-soft); border-radius:18px; box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(14px) saturate(1.3); backdrop-filter:blur(14px) saturate(1.3); }

/* ── Kopf ── */
header { flex:none; display:flex; align-items:center; gap:12px; padding:10px 14px; }
.ttl { display:flex; flex-direction:column; min-width:0; }
.ttl small { font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent-ink); }
.ttl b { font-family:var(--head); font-weight:600; font-size:18px; line-height:1.15; }
#steps { margin-left:auto; display:flex; gap:4px; }
.stp { border:1px solid var(--line-soft); background:rgba(255,255,255,.03); border-radius:99px; padding:6px 12px 6px 6px; cursor:pointer;
  display:flex; align-items:center; gap:7px; font-size:14px; font-weight:600; color:var(--ink-soft); }
.stp i { font-style:normal; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-family:var(--mono); font-size:12.5px;
  border:1px solid var(--line); color:var(--ink-soft); }
.stp.on { border-color:var(--accent); color:var(--ink); box-shadow:var(--glow); }
.stp.on i { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
.stp.done i { border-color:var(--accent); color:var(--accent-ink); }

/* ── Bühne ── */
main { flex:1; min-height:0; position:relative; padding:0 14px; }
#stage { position:absolute; inset:0 14px; width:calc(100% - 28px); height:100%; display:block; }
#stage text { font-family:var(--font); }
.pill rect { fill:#0b1528; stroke-width:1.6; }
.pill text { font-family:var(--mono) !important; font-weight:700; fill:var(--ink); }
.pgimg { transition:filter .6s; }
.hide .pgimg { filter:brightness(0) drop-shadow(0 0 2px rgba(207,224,245,.85)); }
.mk { transition:transform .7s cubic-bezier(.3,1.3,.5,1); }
html[data-motion="low"] .mk, html[data-motion="low"] .pgimg { transition:none; }

/* Schritt 4 (3. Fassung): links dasselbe Bild wie „Anpassen“, rechts die Karte + eine Zeile darunter */
.pghit { cursor:pointer; }
body.s4 #stage { width:calc(54% - 21px); }
#tal { position:absolute; inset:0 14px 0 calc(54% + 7px); display:grid; grid-template-rows:minmax(0, 1fr) auto; gap:8px; }
#mapWrap { position:relative; min-height:0; display:flex; align-items:center; justify-content:center; }
#map { display:block; border-radius:16px; touch-action:none; box-shadow:var(--shadow); cursor:grab; }
.ax { position:absolute; font-family:var(--mono); font-size:12.5px; font-weight:700; pointer-events:none; }
#side { display:flex; flex-wrap:wrap; gap:4px 14px; justify-content:center; font-size:13.5px; color:var(--ink-soft); }
#side b { color:var(--accent-ink); font-family:var(--head); font-weight:600; }
#side .sc { color:var(--ink); } #side .sc b { color:var(--ink); }

/* ── Fuß: ein Satz + Knöpfe ── */
footer { flex:none; display:flex; flex-wrap:wrap; gap:12px 16px; align-items:center; margin:10px 14px 12px; padding:14px 16px; }
#explain { flex:1 1 340px; min-width:0; }
#explain p { margin:0; font-size:clamp(15px, 2.3vh, 18px); line-height:1.45; color:var(--ink-soft); }
#explain p b { color:var(--ink); }
#explain .f { display:inline-block; margin-top:8px; font-family:var(--mono); font-size:clamp(13px, 2vh, 15px); padding:5px 10px; border-radius:9px;
  background:rgba(92,242,196,.08); border:1px solid rgba(92,242,196,.35); color:var(--ink); }
#ctrl { flex:none; display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
.lr { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); font-weight:600; }
.lr input { width:120px; accent-color:var(--accent); }
.lr b { font-family:var(--mono); color:var(--ink); min-width:30px; }

/* hochkant / schmal */
@media (max-width: 760px), (orientation: portrait) {
  .stp span { display:none; } .stp { padding-right:6px; }
  footer { flex-direction:column; align-items:stretch; gap:10px; }
  #explain { flex:none; }
  #ctrl { justify-content:flex-start; }
  body.s4 #stage { width:calc(100% - 28px); height:50%; }
  #tal { inset:50% 14px 0 14px; }
}
@media (max-width: 480px) {
  header { gap:8px; padding:8px 10px; }
  .ttl small { display:none; }
  .ttl b { font-size:15px; }
  main { padding:0 8px; } #stage { inset:0 8px; width:calc(100% - 16px); }
  footer { margin:8px; padding:10px 12px; }
  .btn { padding:9px 12px; font-size:14px; }
}
@media (max-height: 480px) {
  header { padding:6px 12px; }
  .ttl small { display:none; }
  footer { margin:6px 12px 8px; padding:8px 12px; }
  #explain p { font-size:14px; }
  #explain .f { margin-top:4px; font-size:12.5px; }
}
html[data-motion="low"] .glass { -webkit-backdrop-filter:none !important; backdrop-filter:none !important; background:var(--surface) !important; }
</style>
</head>
<body>
<header>
  <a class="btn sm" href="index.html" aria-label="Übersicht">‹</a>
  <div class="ttl"><small>Phase 1 · Erarbeitung</small><b>Wie lernt ein Neuron?</b></div>
  <nav id="steps" aria-label="Schritte"></nav>
</header>

<main>
  <svg id="stage" role="img" aria-label="Ein Neuron: zwei Messwerte des Schnabels, zwei Gewichte, Ausgang Zügelpinguin ja oder nein"></svg>
  <div id="tal" hidden>
    <div id="mapWrap"><canvas id="map" aria-label="Fehler-Landschaft über die zwei Gewichte, der Pinguin steht beim jetzigen Neuron"></canvas></div>
    <div id="side"></div>
  </div>
</main>

<footer class="glass">
  <div id="explain" aria-live="polite"></div>
  <div id="ctrl"></div>
</footer>

<script src="js/welt.js?v=20261118a"></script>
<script src="js/bilder.js?v=20261118f"></script>
<script src="js/raum.js?v=20261118o"></script>
<script src="js/erarbeitung.js?v=20261118c"></script>
</body>
</html>
