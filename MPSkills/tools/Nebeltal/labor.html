<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<script src="../../../motion.js?v=20261115a"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nebeltal Labor</title>
<link href="../../../fonts/spacegrotesk-jetbrainsmono-unbounded-9f6dea.css" rel="stylesheet">
<style>
/* Look „Eiswelt“ wie das Spiel (index.html): immer Polarnacht – Level 8 ist ein Level wie die
   anderen (Sönke 17.11.2026: alle Level übernehmen die UI aus Level 1–3, ohne Schnee). */
:root {
  --paper:#070d1a; --surface:#0f1b31; --surface-2:#16243e; --line:#26406a; --line-soft:rgba(140,170,220,.2);
  --ink:#e8f1ff; --ink-soft:#a9bad6; --ink-faint:#6f82a3;
  --accent:#5cf2c4; --accent-ink:#7ff7d3; --accent-dim:rgba(92,242,196,.14); --on-accent:#04201a; --violet:#a98bff;
  --grad:linear-gradient(120deg, #5cf2c4, #62d2ff 60%, #a98bff); --on-grad:#04201a;
  --orange:#ff9d4d; --gold:#ffd166; --warn:#ff6b8b; --blue:#6aa8ff;
  --glass:rgba(12,22,40,.78); --ice:#1b2c46; --fog:#101a2c;
  --shadow:0 0 0 1px rgba(92,242,196,.08), 0 18px 40px -18px rgba(0,0,0,.8);
  --glow:0 0 22px -6px rgba(92,242,196,.6);
  --font:'Space Grotesk', system-ui, sans-serif; --head:'Unbounded', 'Space Grotesk', sans-serif; --mono:'JetBrains Mono', monospace;
  color-scheme:dark;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; height:100%; background:radial-gradient(120% 80% at 50% 0%, #10203d 0%, var(--paper) 60%); color:var(--ink);
  font-family:var(--font); overflow:hidden; -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent; }
button { font:inherit; color:inherit; }
.btn { border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:9px 14px;
  font-weight:600; font-size:15px; cursor:pointer; }
.btn:hover { border-color:var(--accent); }
.glass { background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
.box-t { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); }

#lab { display:flex; flex-direction:column; height:100%; padding:10px 12px 12px; gap:10px; }
.head { display:flex; align-items:center; gap:10px; flex:none; }
.head h1 { font-size:18px; margin:0; }
.head .proto { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--accent-ink);
  background:var(--accent-dim); padding:3px 8px; border-radius:99px; }
.stat { margin-left:auto; display:flex; gap:14px; font-size:14px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
.stat b { color:var(--ink); font-size:17px; }
.top { flex:1.15; min-height:0; display:grid; grid-template-columns:1.4fr 1fr; gap:10px; }
.top > section { min-height:0; display:flex; flex-direction:column; padding:8px 10px; }
.cloud { flex:1; min-height:0; width:100%; display:block; touch-action:none; cursor:grab; }
#cloud2Box { display:none; }
body[data-mode="zahl"] #cloud2Box { display:flex; }
body[data-mode="zahl"] .top { grid-template-columns:0.85fr 0.85fr 1.7fr; }
body:not([data-mode="zahl"]) #ordSeg { display:none; }
.ordfix { font-size:13px; color:var(--ink-faint); white-space:nowrap; }
.ordfix b { color:var(--ink); }
.seg { display:flex; align-items:center; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.seg span { padding:0 8px; font-size:13px; font-weight:700; color:var(--ink-faint); }
.seg button { border:0; border-left:1px solid var(--line); background:var(--surface); padding:8px 11px; font-weight:600; font-size:14px; cursor:pointer; }
.seg button:first-child { border-left:0; }
.seg button.on { background:var(--accent); color:var(--on-accent); }
.legend .chip { border:0; padding:3px 6px; font-size:12.5px; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; }
.legend .chip i { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--c); margin-right:5px; }
.legend .chip i.tri { border-radius:0; width:0; height:0; background:none; border-left:5px solid transparent; border-right:5px solid transparent; border-bottom:9px solid var(--c); }
table.w tr.sub th { padding-top:8px; }
.legend { display:flex; gap:6px; flex-wrap:wrap; }
.legend button { border:1.5px solid var(--c); background:transparent; color:var(--ink); border-radius:99px; padding:3px 10px;
  font-size:13px; font-weight:600; cursor:pointer; }
.legend button i { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--c); margin-right:5px; }
.legend button.off { opacity:.4; }
.legend small { color:var(--ink-faint); font-size:12.5px; align-self:center; margin-left:auto; }
/* Leinwand absolut im Rahmen – sonst wächst sie mit ihrer eigenen Pixelgröße immer weiter */
.netwrap { position:relative; flex:1; min-height:190px; }
#net { position:absolute; inset:0; width:100%; height:100%; display:block; }
body[data-mode="zahl"] .netwrap { min-height:140px; }
body[data-mode="zahl"] .top { flex:1.55; }
body[data-mode="zahl"] #ordSeg { display:none; }          /* steht jetzt im Zahlenstrahl unter dem Netz */
body[data-mode="zahl"] .hits { flex-wrap:nowrap; gap:4px 9px; font-size:12.5px; white-space:nowrap; }
body[data-mode="zahl"] .hits .pi { height:20px; }
/* Pinguin für Pinguin (nur Level 8 / Zahl-Neuron): wie Level 5 rund ums Netz –
   links Pinguin + Messwerte auf Höhe der Eingänge, rechts Zahlenstrahl senkrecht */
.netrow { flex:1; display:flex; }
.netrow .netwrap { flex:1; min-width:0; }
#exL, #exR { display:none; }
body[data-mode="zahl"] #exL { display:block; position:relative; flex:none; width:108px; }
body[data-mode="zahl"] #exR { display:block; flex:none; width:auto; height:100%; max-width:100px; }
body[data-mode="zahl"] .netrow .netwrap { margin-left:-40px; }
#exR text, #exL { font-family:var(--font); }
#exR .mono { font-family:var(--mono); }
#exL .exPg { position:absolute; left:0; top:50%; transform:translateY(-50%); width:50px; text-align:center; }
#exL .exPg b { display:block; font-size:11px; font-weight:700; }
#exL .exPg svg { width:50px; height:auto; display:block; }
#exL .exV { position:absolute; right:0; transform:translateY(-50%); text-align:right; line-height:1.05; }
#exL .exV small { display:block; font-size:10.5px; color:var(--ink-faint); font-weight:600; }
#exL .exV b { font-family:var(--mono); font-size:13px; font-weight:700; color:var(--ink); white-space:nowrap; }
/* Lernkurve in der Steuerleiste */
.lcbox { display:flex; flex-direction:column; line-height:1.1; }
.lcbox small { font-size:11px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
#lcurve { width:min(250px, 21vw); height:46px; display:block; }
body[data-mode="zahl"] #lr { width:min(220px, 17vw); }
.hits { font-size:13px; color:var(--ink-soft); display:flex; flex-wrap:wrap; gap:4px 12px; font-variant-numeric:tabular-nums; }
.hits b { font-weight:700; }
.cloudnote { font-size:12px; color:var(--ink-faint); }
table.w { width:100%; border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums; }
table.w th { font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; font-weight:700; padding:3px 4px; text-align:right; }
table.w th:first-child, table.w td:first-child { text-align:left; }
table.w td { padding:4px 4px; text-align:right; border-top:1px solid var(--line); font-weight:600; }
table.w td.w1 { background:color-mix(in srgb, var(--c) 9%, transparent); }
table.w td.w2 { background:color-mix(in srgb, var(--c) 17%, transparent); }
table.w td:first-child { color:var(--c); font-weight:700; }
table.w td.ok { color:var(--ink-faint); font-weight:600; }
.ctrl { flex:none; display:flex; align-items:center; gap:10px; padding:8px 12px; flex-wrap:wrap; justify-content:center; }
.ctrl .lr { display:flex; flex-direction:column; line-height:1.1; }
.ctrl .lr small { font-size:11px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
#lrV { font-size:19px; font-weight:700; min-width:40px; font-variant-numeric:tabular-nums; }
#lr { width:min(220px, 32vw); accent-color:var(--orange); }
#step { background:var(--orange); color:#fff; border-color:var(--orange); }
#auto.on { background:var(--warn); color:#fff; border-color:var(--warn); }
.ctrl .hint { font-size:13px; color:var(--ink-faint); }
.grid { flex:1; min-height:0; display:grid; grid-template-columns:repeat(var(--cols, 3), 1fr); grid-template-rows:repeat(2, 1fr); gap:8px; }
.cell { position:relative; min-height:0; border-radius:12px; overflow:hidden; border:2px solid var(--c); background:var(--surface); }
.cell canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair; }
.cell .t { position:absolute; left:6px; top:5px; padding:2px 8px; border-radius:99px; background:var(--c); color:#fff;
  font-size:12.5px; font-weight:700; pointer-events:none; }
@media (orientation: portrait) {
  .top { grid-template-columns:1fr; grid-template-rows:1.3fr auto; flex:1.5; }
  body[data-mode="zahl"] .top { grid-template-columns:1fr 1fr; grid-template-rows:1fr auto; }
  body[data-mode="zahl"] .top > section:last-child { grid-column:1 / -1; }
  .netwrap { min-height:230px; }
}
@media (max-height: 700px) and (orientation: landscape) { .netwrap { min-height:170px; } }
/* Eiswelt */
.btn { border-radius:14px; background:var(--surface-2); text-decoration:none; }
.btn:hover { box-shadow:var(--glow); }
.glass { background:var(--glass); border-color:var(--line-soft); border-radius:16px;
  -webkit-backdrop-filter:blur(14px) saturate(1.3); backdrop-filter:blur(14px) saturate(1.3); }
html[data-motion="low"] .glass { -webkit-backdrop-filter:none !important; backdrop-filter:none !important; background:var(--surface) !important; }
.head h1 { font-family:var(--head); font-weight:600; font-size:16px; }
.head .proto { font-family:var(--mono); }
.stat b, #lrV { font-family:var(--mono); }
#step { background:var(--orange); color:#2a1400; border-color:var(--orange); }
.seg button.on { background:var(--grad); color:var(--on-grad); }
.hits .pi { height:26px; vertical-align:middle; margin-right:3px; filter:drop-shadow(0 0 1.2px rgba(220,235,255,.55)); }
.legend .chip img { height:24px; margin-right:4px; filter:drop-shadow(0 0 1.2px rgba(220,235,255,.55)); }
/* Level 8 (labor.html?level=8): fest „+ Zahl-Neuron“, Erklärkarte vorweg */
body[data-level="8"] #mode, body[data-level="8"] .head .proto { display:none; }
#card { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(3,7,16,.55); overflow:auto; z-index:5; }
.card-in { width:min(640px, 100%); padding:22px 22px 18px; background:var(--glass); border:1px solid var(--line); border-radius:20px;
  box-shadow:var(--shadow); max-height:100%; overflow:auto; -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
.card-kicker { font-family:var(--mono); font-size:11.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent-ink); }
.card-in h2 { margin:4px 0 10px; font-family:var(--head); font-weight:600; font-size:24px; }
.card-in p { margin:0 0 12px; line-height:1.5; font-size:16px; color:var(--ink-soft); }
.card-in p b, ol.steps li b { color:var(--ink); }
.illwrap { margin:0 0 12px; border-radius:14px; overflow:hidden; border:1px solid var(--line-soft); background:var(--surface-2); }
.ill { display:block; width:100%; height:auto; }
.pg { filter:drop-shadow(0 0 1.4px rgba(220,235,255,.55)); }
ol.steps { list-style:none; counter-reset:st; margin:0 0 10px; padding:0; display:grid; gap:8px; }
ol.steps li { counter-increment:st; position:relative; padding:2px 0 2px 36px; line-height:1.45; font-size:15.5px; color:var(--ink-soft); }
ol.steps li::before { content:counter(st); position:absolute; left:0; top:0; width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
  border:1px solid var(--accent); color:var(--accent-ink); font-weight:700; font-size:14px; font-family:var(--mono); }
.card-btns { display:flex; gap:8px; flex-wrap:wrap; }
.btn.primary { background:var(--grad); color:var(--on-grad); border-color:transparent; box-shadow:var(--glow); }
</style>
</head>
<body>
<div id="lab">
  <div class="head">
    <a class="btn" href="index.html">‹ Nebeltal</a>
    <h1>Labor: Pinguine in 3D</h1><span class="proto">Test</span>
    <div class="stat"><span>falsch sortiert <b id="sWrong">–</b></span><span>Fehler <b id="sLoss">–</b></span></div>
  </div>
  <div class="top">
    <section class="glass">
      <div class="legend" id="legend"></div>
      <canvas id="cloud" class="cloud" aria-label="Pinguine als Punktwolke mit den Ebenen der Neuronen"></canvas>
    </section>
    <section class="glass" id="cloud2Box">
      <div class="legend" id="legend2"></div>
      <canvas id="cloud2" class="cloud" aria-label="Pinguine so, wie das Zahl-Neuron sie sieht"></canvas>
    </section>
    <section class="glass">
      <div class="box-t" id="netTitle">Das Netz</div>
      <div class="netrow">
        <div id="exL" aria-label="Der gezeigte Pinguin und seine Messwerte"></div>
        <div class="netwrap"><canvas id="net"></canvas></div>
        <svg id="exR" viewBox="0 0 116 256" aria-label="Zahlenstrahl: welche Art das Netz für diesen Pinguin wählt"></svg>
      </div>
      <div class="hits" id="hits"></div>
    </section>
  </div>
  <div class="ctrl glass">
    <div class="lr"><small>Lernrate</small><span id="lrV">–</span></div>
    <input id="lr" type="range" min="0" max="1000" aria-label="Lernrate">
    <button id="step" class="btn" type="button">Ein Lernschritt</button>
    <button id="auto" class="btn" type="button">Training starten</button>
    <button id="rnd" class="btn" type="button">Neu würfeln</button>
    <div class="seg" id="mode"><button type="button" data-m="own">3 Neuronen</button><button type="button" data-m="zahl">+ Zahl-Neuron</button></div>
    <div class="lcbox"><small>Lernkurve · Fehler je Schritt</small><canvas id="lcurve" aria-label="Fehler nach jedem Lernschritt, Striche = Lernrate geändert"></canvas></div>
    <div class="ordfix" id="ordSeg" title="Fest: Zügel liegt in der Wolke zwischen Adelie und Esel"><b>0</b> Adelie · <b>1</b> Zügel · <b>2</b> Esel</div>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div id="card" hidden></div>
<script src="js/welt.js?v=20261118a"></script>
<script src="js/bilder.js?v=20261118a"></script>
<script src="js/netz.js?v=20261118a"></script>
<script src="js/labor.js?v=20261118a"></script>
</body>
</html>
