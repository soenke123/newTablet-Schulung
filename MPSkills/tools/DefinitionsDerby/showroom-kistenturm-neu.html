<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kistenturm – neue Figuren (Vorschlag)</title>
<link rel="stylesheet" href="../KnowledgeStack/creatures.css"><link rel="stylesheet" href="figuren.css"><link rel="stylesheet" href="figuren-neu.css">
<style>
body{margin:0;padding:16px;background:#e9dcc3;font-family:system-ui,sans-serif;color:#2a2230;--ink:#2a2230}
h1{font-size:20px;margin:0 0 4px} h2{font-size:15px;margin:18px 0 6px} p{margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.f{background:#fffaf0;border-radius:12px;padding:8px;width:200px;box-shadow:0 2px 6px #0002;border-top:6px solid var(--tc)}
.f b{display:block;color:var(--tc)} .f small{display:block;min-height:3.6em;font-size:12px;opacity:.75}
.f .pic{width:140px;height:140px;margin:0 auto} .bar{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.sz{display:flex;align-items:flex-end;gap:10px;margin:6px 0;background:#fffaf0;border-radius:10px;padding:6px 10px;width:max-content;max-width:100%;overflow:auto}
button{font:inherit;font-size:12px;padding:3px 7px}
</style></head><body>
<h1>Kistenturm – Vorschlag neue Teamfiguren</h1>
<p>Noch nicht im Spiel. Knöpfe: Heben · Jubeln · Traurig · Ruhe. <button id=all>alle heben</button></p>
<div class=row id=row></div>
<h2>So klein wie im Spiel (150 · 120 · 54 · 38 px)</h2><div id=sizes></div>
<h2>Zum Vergleich: die jetzigen Figuren (54 · 38 px)</h2><div id=old></div>
<script src="../KnowledgeStack/creatures.js"></script><script src="figuren.js"></script><script src="figuren-neu.js"></script>
<script>
const F=DDFigurenNeu,row=document.getElementById('row');
row.innerHTML=F.LIST.map((d,i)=>'<div class=f style="--tc:'+d.col+'"><div class=pic data-i='+i+'>'+F.svg(i,'idle',140)+'</div><b>'+d.name+'</b><small>'+d.say+'</small><div class=bar>'+['lift','cheer','sad','idle'].map(a=>'<button data-i='+i+' data-a='+a+'>'+a+'</button>').join('')+'</div></div>').join('');
const set=(i,a)=>{const p=row.querySelector('.pic[data-i="'+i+'"]');p.innerHTML=F.svg(i,a,140);if(a==='lift')setTimeout(()=>{p.innerHTML=F.svg(i,'idle',140)},950)};
row.onclick=e=>{const b=e.target.closest('button');if(b)set(+b.dataset.i,b.dataset.a)};
document.getElementById('all').onclick=()=>F.LIST.forEach((_,i)=>set(i,'lift'));
document.getElementById('sizes').innerHTML=[150,120,54,38].map(px=>'<div class=sz>'+F.LIST.map((_,i)=>F.svg(i,'idle',px)).join('')+'</div>').join('');
document.getElementById('old').innerHTML=[54,38].map(px=>'<div class=sz>'+DDFiguren.LIST.map((_,i)=>DDFiguren.svg(i,'idle',px)).join('')+'</div>').join('');
const q=new URLSearchParams(location.search).get('a'); if(q) F.LIST.forEach((_,i)=>{row.querySelector('.pic[data-i="'+i+'"]').innerHTML=F.svg(i,q,140)});
</script></body></html>
