<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SQL Studio</title>
<!-- Schriften lokal (Datenschutz: keine Anfrage an Google), derselbe Satz wie MPSkills. -->
<link rel="stylesheet" href="../../../fonts/outfit-inter-jetbrainsmono-985fda.css">
<link rel="stylesheet" href="css/app.css?v=20261024b">
</head>
<body class="loading">

<div class="app">
  <header class="top">
    <button type="button" class="btn btn--icon only-narrow" id="btnSide" aria-label="Datenbanken">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="brand">
      <svg class="ic brand-ic" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v13c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-13"/><path d="M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"/></svg>
      <span class="brand-t">SQL Studio</span>
    </div>
    <div class="crumb"><span class="crumb-sep">/</span><span id="curName"></span><span class="crumb-kind" id="curKind"></span></div>
    <button type="button" class="save" id="saveState" hidden></button>
    <span class="spacer"></span>
    <span class="chip" id="rightsChip" hidden></span>
    <button type="button" class="btn" id="btnImport" title="SQL- oder SQLite-Datei importieren">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5V4.5M7.5 9 12 4.5 16.5 9M5 19.5h14"/></svg><span class="hide-s">Importieren</span>
    </button>
    <div class="menu-wrap">
      <button type="button" class="btn btn--icon" id="btnMore" aria-label="Mehr" aria-haspopup="true">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></svg>
      </button>
      <div class="menu" id="moreMenu" role="menu" hidden></div>
    </div>
    <input type="file" id="fileIn" accept=".sql,.txt,.sqlite,.sqlite3,.db" hidden>
  </header>

  <aside class="side" id="side" aria-label="Datenbanken"></aside>
  <div class="side-back" id="sideBack"></div>

  <main class="main">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Ansicht">
      <button type="button" class="tab" role="tab" data-tab="sql">SQL</button>
      <button type="button" class="tab" role="tab" data-tab="data">Daten</button>
      <button type="button" class="tab" role="tab" data-tab="struct">Struktur</button>
      <button type="button" class="tab" role="tab" data-tab="diagram">Diagramm</button>
    </nav>
    <section class="pane" id="pane-sql" role="tabpanel"></section>
    <section class="pane" id="pane-data" role="tabpanel" hidden></section>
    <section class="pane" id="pane-struct" role="tabpanel" hidden></section>
    <section class="pane" id="pane-diagram" role="tabpanel" hidden></section>
    <div class="none-msg" id="noneMsg">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v13c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-13"/><path d="M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"/></svg>
      <p><b>Noch keine Datenbank da.</b></p>
      <p>Sobald deine Lehrkraft eine Datenbank freigibt, erscheint sie links — ganz von selbst.</p>
    </div>
  </main>
</div>

<div class="menu share-menu" id="shareMenu" role="menu" hidden></div>
<div class="drop-hint">Datei loslassen zum Importieren</div>

<script src="js/core.js?v=20261024b"></script>
<script src="js/client.js?v=20261024b"></script>
<script src="js/ui.js?v=20261024b"></script>
<script src="js/editor.js?v=20261024b"></script>
<script src="js/diagram.js?v=20261024b"></script>
<script src="js/panes.js?v=20261024b"></script>
<script src="js/app.js?v=20261024b"></script>
</body>
</html>
