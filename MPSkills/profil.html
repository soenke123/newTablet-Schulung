<script>
  /* Die Seite ist nur noch die Adresse — Inhalt und Verhalten stehen
     in lib/profilemodal.js, dasselbe wie das Fenster im Menü. */
  /* Seit 24.11.2026 das EINE Profil für alle Bereiche: Landing,
     GameHub und Admin verlinken hierher mit ?von=…, „Zurück“ führt
     dorthin. Nur feste Ziele, nie eine Adresse aus der URL. */
  (function () {
    const BACK = {
      schulung: ['../index.html',         '‹ Zurück zur Startseite'],
      gamehub:  ['../GameHub/index.html', '‹ Zurück zum GameHub'],
      admin:    ['../admin/index.html',   '‹ Zurück zum Admin-Bereich']
    };
    const b = BACK[new URLSearchParams(location.search).get('von')];
    if (!b) return;
    const a = document.getElementById('backLink');
    a.href = b[0]; a.textContent = b[1]; a.hidden = false;
  })();
  (async function () {
    window.MPUserBar?.mount();
    await (window.waitForSession?.() ?? Promise.resolve());
    window.MPProfile.renderPage(document.getElementById('profHost'));
  })();
</script>
